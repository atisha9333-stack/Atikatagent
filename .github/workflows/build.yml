name: Build ATIK AI AGENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find Android project
        run: |
          find . -name settings.gradle.kts -not -path '*/.gradle/*'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle.kts -not -path '*/.gradle/*' | head -n 1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATIK-AI-AGENT-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
